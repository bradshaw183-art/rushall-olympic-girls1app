plugins { id 'com.android.application' }

android {
    namespace 'uk.co.rushallolympicgirls.app'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.co.rushallolympicgirls.app'
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.onesignal:OneSignal:5.9.9'
}
